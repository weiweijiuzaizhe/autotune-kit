# Evaluation limits unified profile (cross-model comparable)
#
# These limits control the LF-aligned reasoning subset size:
# - LIMIT_MMLU: max total MMLU examples to sample.
# - LIMIT_PER_SUBJECT: max MMLU examples per subject (keeps balance).
# - CEVAL_SUBJECT_LIMIT: number of C-Eval subjects to include.
# - CMMLU_SUBJECT_LIMIT: number of CMMLU subjects to include.
#
# Notes:
# - All models share the SAME defaults to keep horizontal comparisons fair.
# - Bigger values are more stable but slower.
# - You can override at runtime via env vars:
#   LIMIT_MMLU / LIMIT_PER_SUBJECT / CEVAL_SUBJECT_LIMIT / CMMLU_SUBJECT_LIMIT

# Unified defaults for all models.
DEFAULT_LIMIT_MMLU=200
DEFAULT_LIMIT_PER_SUBJECT=10
DEFAULT_CEVAL_SUBJECT_LIMIT=5
DEFAULT_CMMLU_SUBJECT_LIMIT=5

# Keep model rules empty to enforce one unified evaluation caliber.
MODEL_LIMIT_RULES=()
